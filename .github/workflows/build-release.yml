name: Build and Release

on:
  push:
    branches:
      - drugs-apotheke
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests and GameTests
        run: ./gradlew test runGameTestServer --no-daemon

      - name: Build JAR with Gradle
        run: ./gradlew jar --no-daemon

      - name: Upload or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            TAG="v$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          fi
          echo "Target release tag: $TAG"
          # Fixed-name copy so releases/latest/download/createbrewery.jar always works (update bat).
          cp build/libs/createbrewery-*.jar build/createbrewery.jar
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A published version is never replaced by a branch push: bump mod_version for a new release.
            if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              echo "Release $TAG already exists; bump mod_version to publish. Skipping upload."
              exit 0
            fi
            echo "Uploading asset to existing release $TAG..."
            gh release upload "$TAG" build/libs/*.jar build/createbrewery.jar --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" build/libs/*.jar build/createbrewery.jar --title "Create Brewery $TAG" --generate-notes
          fi
