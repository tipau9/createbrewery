modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/tipau9/createbrewery/issues"

[[mods]]
modId = "createbrewery"
version = "${mod_version}"
displayName = "Create Brewery"
authors = "tipau9"
displayURL = "https://github.com/tipau9/createbrewery"
description = '''
Brewing, distilling and nightlife built on Create: an automatable beer chain with a passive Fermenter,
spirits and casks, drunkenness and other intoxicants with screen effects, and a club with DJ booth,
DMX lighting, amp rack and speakers.
'''

[[mixins]]
config = "createbrewery.mixins.json"

[[dependencies.createbrewery]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.228,)"

[[dependencies.createbrewery]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"

[[dependencies.createbrewery]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"

[[dependencies.createbrewery]]
modId = "jei"
type = "optional"
versionRange = "[19.0,)"
